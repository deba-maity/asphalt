name: Validate project and site
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.0'
      - name: Pinned engine and headless import
        shell: powershell
        run: ./tools/setup.ps1
      - name: Source suite and complete campaign
        shell: powershell
        run: ./tools/test.ps1 -Campaign
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: headless-validation-logs
          path: tools/logs/
          if-no-files-found: error
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: tools/qa/package-lock.json
      - run: python tools/site_release.py
      - run: python tools/check_site.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tools/qa
      - run: npx playwright install --with-deps chromium
        working-directory: tools/qa
      - run: npm test
        working-directory: tools/qa
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: site-checks
          path: tools/qa/test-results/
