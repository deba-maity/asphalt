name: NIGHTSHIFT checks
on:
  push:
    branches: [nightshift]
  pull_request:
    branches: [nightshift]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:smoke
      - run: node scripts/visual-contracts.mjs
      - run: node scripts/network-browser.mjs
      - run: node scripts/network-race.mjs
      - run: node scripts/mode-contracts.mjs
      - run: node scripts/production-smoke.mjs
