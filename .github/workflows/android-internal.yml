name: Android internal experiment (not mobile support)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  internal:
    if: ${{ vars.ENABLE_ANDROID_INTERNAL == 'true' }}
    runs-on: windows-2025
    environment: android-internal
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.0'
      - name: Prepare pinned engine, Android template and SDK packages
        shell: powershell
        run: |
          ./tools/setup.ps1
          python tools/fetch_windows_templates.py --android
          if ($LASTEXITCODE -ne 0) { throw 'Template fetch failed.' }
          $env:JAVA_HOME=$env:JAVA_HOME_17_X64
          $sdkmanager=Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          if (-not (Test-Path -LiteralPath $sdkmanager)) { throw 'Hosted runner SDK manager missing; follow docs/android.md.' }
          & $sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.1.0'
          if ($LASTEXITCODE -ne 0) { throw 'SDK package installation failed.' }
      - name: Export and verify signed internal APK
        shell: powershell
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if (-not $env:ANDROID_KEYSTORE_BASE64) { throw 'Keystore secret missing. No APK exists.' }
          $keyFile=Join-Path $env:RUNNER_TEMP 'ashen-vow-release.keystore'
          try {
            [IO.File]::WriteAllBytes($keyFile,[Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            $env:GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$keyFile
            ./tools/android.ps1 -JavaDirectory $env:JAVA_HOME_17_X64 -SdkDirectory $env:ANDROID_HOME -InternalBuild
          } finally { if (Test-Path -LiteralPath $keyFile) { Remove-Item -LiteralPath $keyFile } }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-signed-internal-UNTESTED
          path: exports/android/AshenVow-internal.apk
          if-no-files-found: error
          retention-days: 7
