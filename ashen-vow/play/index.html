<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#181b1a">
  <title>ASHEN VOW</title>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

  <style>
    :root { color-scheme: dark; font-family: Georgia, serif; color: #eee6d5; background: #101313; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; }
    #canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; touch-action: none; }
    #status {
      position: fixed; inset: 0; isolation: isolate; display: grid; align-items: end;
      overflow: hidden auto; padding: max(1.25rem, 7vh) max(1.5rem, 6vw);
      background: #202527;
    }
    #status::before, #status::after {
      content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    }
    #status::before {
      background: url("index.png") 67% center / cover no-repeat;
      animation: reach-shore 9s ease-out both;
    }
    #status::after {
      background: linear-gradient(90deg, #111916eb, #161b1b8f 39%, transparent 73%),
        linear-gradient(0deg, #141916be, transparent 59%);
    }
    @keyframes reach-shore { from { transform: scale(1.035); } to { transform: scale(1); } }
    #status.finished::before { animation: none; }
    @media (prefers-reduced-motion: reduce) { #status::before { animation: none; } }
    #status main { width: min(25rem, 100%); }
    h1 { margin: 0 0 .8rem; font-weight: 400; font-size: clamp(3.5rem, 11vmin, 7.7rem);
      line-height: .87; text-transform: uppercase; letter-spacing: -.045em; color: #fff4dd; }
    h1 span { display: block; }
    #message { margin: 1.3rem 0 .8rem; font: 1rem/1.5 system-ui, sans-serif; color: #f4e9d5; }
    @media (orientation: portrait) {
      #status { padding-bottom: max(4.7rem, 10vh); }
      #status::before { background-position: 91% center; }
      #status::after { background: linear-gradient(0deg, #101614 6%, #131916d4 30%, transparent 76%); }
    }
    progress { display: block; width: 100%; height: .28rem; border: 0; border-radius: 2px; accent-color: #d2ad70; }
    progress::-webkit-progress-bar { background: #454640; }
    progress::-webkit-progress-value { background: #d2ad70; }
    #amount, #rotate, #retry { font: .92rem/1.5 system-ui, sans-serif; }
    #amount { display: block; margin: .5rem 0 0; font-variant-numeric: tabular-nums; color: #d3c9b9; }
    #retry { background: #e2c28d; color: #27231d; font-weight: 600; border: 0; border-radius: .2rem; padding: .6rem 1.3rem; cursor: pointer; }
    #retry:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    [hidden] { display: none !important; }
    #rotate { display: none; pointer-events: none; }
    @media (orientation: portrait) and (pointer: coarse) and (max-width: 820px) {
      #rotate { display: block; position: fixed; inset: auto 1.5rem max(1rem, env(safe-area-inset-bottom)); text-align: center; color: #d3c9b9; }
    }
  </style>
  <noscript><style>#status main > :not(h1) { display: none; }</style></noscript>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Ashen Vow game"></canvas>
  <section id="status">
    <main>
      <h1>Ashen <span>Vow</span></h1>
      <p id="message" role="status">Opening the Counting Shore…</p>
      <progress id="status-progress" aria-label="Game download"></progress>
      <output id="amount" aria-hidden="true"></output>
      <button id="retry" hidden type="button">Try again</button>
    </main>
    <noscript>Enable JavaScript to play Ashen Vow in this browser.</noscript>
  </section>
  <p id="rotate">Turn your phone sideways for larger controls.</p>
  <script src="index.js"></script>
  <script>
    const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":40590088,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const statusPanel = document.getElementById('status');
    const message = document.getElementById('message');
    const progress = document.getElementById('status-progress');
    const amount = document.getElementById('amount');
    const retry = document.getElementById('retry');
    const mb = bytes => (bytes / 1048576).toFixed(1) + ' MiB';
    retry.addEventListener('click', () => location.reload());

    function releasePointer() {
      if (!retry.hidden && document.pointerLockElement) document.exitPointerLock();
    }
    document.addEventListener('pointerlockchange', releasePointer);

    function showEnd(text, button) {
      statusPanel.classList.add('finished');
      message.textContent = text;
      progress.hidden = true;
      amount.hidden = true;
      retry.textContent = button;
      retry.hidden = false;
      document.getElementById('canvas').hidden = true;
      releasePointer();
      document.body.append(statusPanel);
      retry.focus();
    }

    function sessionEnded(code) {
      if (!retry.hidden) return;
      showEnd(code === 0 ? 'Your game has closed.' : 'The game stopped before it could finish.', code === 0 ? 'Play again' : 'Try again');
    }
    window.addEventListener('ashen-vow-quit', () => sessionEnded(0), {once: true});

    async function boot() {
      try {
        if (typeof Engine !== 'function') throw new Error('The game engine could not be downloaded. Check your connection and try again.');
        const missing = Engine.getMissingFeatures({threads: false});
        if (missing.length) throw new Error('This browser needs ' + missing.join(', ') + ' to play. Try a browser with hardware acceleration enabled.');
        const engine = new Engine(config);
        const totalSize = Object.values(config.fileSizes).reduce((sum, bytes) => sum + bytes, 0);
        amount.textContent = mb(totalSize) + ' of game files';
        await engine.startGame({
          onProgress(current, total) {
            if (total <= 0 || current < 0) return;
            progress.max = total;
            progress.value = current;
            amount.textContent = current >= total ? 'Starting the game…' : mb(current) + ' / ' + mb(total);
          },
          onExit: sessionEnded
        });
        if (retry.hidden) statusPanel.remove();
      } catch (error) {
        const reason = error.message || String(error);
        const text = /failed to fetch|networkerror|load failed/i.test(reason)
          ? 'The game files could not finish downloading. Check your connection and try again.'
          : reason;
        showEnd(text, 'Try again');
      }
    }
    boot();
  </script>
</body>
</html>
